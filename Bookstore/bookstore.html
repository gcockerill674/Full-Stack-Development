<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bookstore</title>
        <link rel="stylesheet" href="bookstore.css">
    </head>
    <body>
        <div class="paper">
            <section class="band top-band">
                <div class="logo-box">LOGO</div>
                <div class="mini-tags">
                    <span class="tag tag-pink">Catalog</span>
                    <span class="tag tag-purple">Login</span>
                    <span class="tag tag-blue">Shopping Cart</span>
                </div>
            </section>

            <section class="band mid-band">
                <div class="mid-content">
                    <h2>Greg's Great Books</h2>
                    <div class="feature-row">
                        <div class="feature-card">
                            <span>Today's Pick</span>
                            <div class="book-box"><img src="https://upload.wikimedia.org/wikipedia/en/d/db/The_Maze_Runner_cover.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="The Maze Runner by James Dashner"></div>
                        </div>
                        <div class="feature-card">
                            <span>Recent Release</span>
                            <div class="book-box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS99eIeRix0_1Okupg391YNORLf8VnZGLx3BYKPMxY3NQ&s=10" alt="A Whisper in the Walls by Scott Reintgen"></div>
                        </div>
                        <div class="feature-card">
                            <span>Special Order</span>
                            <div class="book-box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnRuoSPF9CMQ7E45XxbBvMG7liGX0bJPqwpvEedR1DfA&s=10" alt="1984 by George Orwell"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="band bottom-band">
                <div class="contact-box">Contact Info<br>Phone: (123) 456-7890<br>Email: info@gregsgreatbooks.com</div>
                <div class="map-box"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3028.2042074274113!2d-96.96119339999991!3d40.6253783!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8796e50055634a25%3A0x112d24ba4b3a9dbd!2s1302%20Main%20Ave%2C%20Crete%2C%20NE%2068333!5e0!3m2!1sen!2sus!4v1788968590316!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
            </section>
        </div>
    </body>
</html>
