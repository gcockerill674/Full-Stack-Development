<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <style>
        .generated-image {
            width: 100%;
            max-width: 420px;
        }
    </style>
    <title>Random Dog Generator</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Random Dog Generator</h1>
        <div class="text-center">
            <button id="generateDogBtn" class="btn btn-primary mb-3">Generate Random Dog</button>
            <div id="dogContainer" class="mt-3"></div>
        </div>
    </div>

    <script>
        // Adds event listener to button to fetch API when clicked
        document.getElementById('generateDogBtn').addEventListener('click', async () => {
            // Logs to console when request starts (Had trouble with duck so needed this for testing)
            console.log('Starting request...');
            // Fetches and awaits the response from the API
            const response = await fetch('https://random.dog/woof.json');
            // Logs to console when request comes back (Had trouble with duck so needed this for testing)
            console.log('Response:', response);
            // awaits response.json() to get the data from the API
            const data = await response.json();
            // Logs to console when data is received (Had trouble with duck so needed this for testing)
            console.log('Data:', data);
            // Replaces http with https in the url and sets the innerHTML of dogContainer to display the image
            const imageUrl = data.url.replace(/^http:/, 'https:');
            document.getElementById('dogContainer').innerHTML = `<img src="${imageUrl}" alt="Sorry, Dog Not Found" class="img-fluid rounded generated-image">`;
        });
    </script>
</html>
