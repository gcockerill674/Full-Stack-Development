<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <h1 class="mb-4">Dog List</h1>
        <p id="message" class="d-none" role="status" aria-live="polite"></p>
        <div class="table-responsive mb-5">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Breed</th>
                <th scope="col">Age</th>
                <th scope="col">Delete</th>
              </tr>
            </thead>
            <tbody id="dog-list"></tbody>
          </table>
        </div>

        <section aria-labelledby="add-dog-heading">
          <h2 id="add-dog-heading" class="h4 mb-3">Add a dog</h2>
          <form id="add-dog-form" class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label" for="dog-name">Name</label>
              <input class="form-control" id="dog-name" name="name" required minlength="3">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="dog-breed">Breed</label>
              <input class="form-control" id="dog-breed" name="breed" required>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="dog-age">Age</label>
              <input class="form-control" id="dog-age" name="age" type="number" min="0" step="1" required>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary" type="submit">Add dog</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="dog.js" defer></script>
</body>
</html>
