<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Bacon Ipsum</title>
    <link rel="stylesheet" href="bacon.css">
    <script src="bacon.js" defer></script>
</head>
<body>
    <h1>Bacon Ipsum</h1>
    <div class="flex-row">
        <div class="flex-column">
            <h2>Generate Your Own Bacon Ipsum</h2>
            <form id="baconForm">
                <label for="type">All Meat or Meat and Filler?</label> 
                <br>
                <select id="type" name="type">
                    <option value="all-meat">All Meat</option>
                    <option value="meat-and-filler">Meat and Filler</option>
                </select> 
                <br> 
                <br>
                <label for="newParagraphs">Number of Paragraphs:</label>
                <br>
                <select id="newParagraphs" name="paragraphs">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <br>
                <br>
                <label for="caesar">Caesar Cipher Shift (1-25):</label>
                <input type="number" id="caesar" name="caesar" min="1" max="25" value="3">
                <button type="button" onclick="getBaconipsum()">Generate Bacon Ipsum!</button>
            </form>
        </div>
        <div class="flex-column">
            <h2>Bacon Ipsum Json Format</h2>
            <br>
            <p id="myRawData"></p>
        </div>
        <div class="flex-column">
            <h2>Bacon Ipsum Text Format</h2>
            <br>
            <p id="myFormattedData"></p>
        </div>
        <div class="flex-column">
            <h2>Bacon Ipsum Caesar Format</h2>
            <br>
            <p id="myCaesarData"></p>
        </div>
    </div>
</body>
