<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Questionaire</title>
        <link rel="stylesheet" href="questionaire.css">
    </head>
    <body>
        <h1>Questionaire</h1>
        <form>
            <label for="name">Name:</label>
            <br>
            <input type="text" id="fname" name="fname" required>
            <br>
            <br>
            <label for="lname">Last Name:</label>
            <br>
            <input type="text" id="lname" name="lname" required>
            <br>
            <br>
            <label for="sport">Choose Your Favorite Sport:</label>
            <br>
            <select id="sport" name="sport" required>
                <option value=""></option>
                <option value="football">Football</option>
                <option value="basketball">Basketball</option>
                <option value="baseball">Baseball</option>
                <option value="soccer">Soccer</option>
                <option value="tennis">Tennis</option>
                <option value="golf">Golf</option>
                <option value="track">Track</option>
                <option value="cross-country">Cross Country</option>
            </select>
            <br>
            <br>
            <p>Choose Your Favorite Music Genre:</p>
            <input type="radio" id="rock" name="music" value="rock" required>
            <label for="rock">Rock</label>
            <br>
            <input type="radio" id="jazz" name="music" value="jazz" required>
            <label for="jazz">Jazz</label>
            <br>
            <input type="radio" id="pop" name="music" value="pop" required>
            <label for="pop">Pop</label>
            <br>
            <input type="radio" id="hip-hop" name="music" value="hip-hop" required>
            <label for="hip-hop">Hip-Hop</label>
            <br>
            <input type="radio" id="country" name="music" value="country" required>
            <label for="country">Country</label>
            <br>
            <input type="radio" id="other" name="music" value="other" required>
            <label for="other">Other</label>
            <br>
            <br>
            <p>What Brands Do You Know?</p>
            <input type="checkbox" id="ford" name="car" value="ford">
            <label for="ford">Ford</label>
            <br>
            <input type="checkbox" id="chevy" name="car" value="chevy">
            <label for="chevy">Chevrolet</label>
            <br>
            <input type="checkbox" id="honda" name="car" value="honda">
            <label for="honda">Honda</label>
            <br>
            <input type="checkbox" id="toyota" name="car" value="toyota">
            <label for="toyota">Toyota</label>
            <br>
            <input type="checkbox" id="nissan" name="car" value="nissan">
            <label for="nissan">Nissan</label>
            <br>
            <br>
            <p>What do you like about Doane University?</p>
            <textarea name="comments" rows="5" cols="40" placeholder="Write here..." required></textarea>
            <br>
            <br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
